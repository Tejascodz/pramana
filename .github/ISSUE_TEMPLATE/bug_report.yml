name: Bug report
description: A crash, an error or wrong behaviour that is not a scoring verdict
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove secrets, keys and personal data from anything you paste.
  - type: input
    id: version
    attributes:
      label: Pramana version
      description: Output of `pramana --version`
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and spec
      description: The command you ran and the relevant part of the audit spec
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
