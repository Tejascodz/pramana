name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check src tests dashboard examples
          ruff format --check src tests dashboard examples
      - name: Unit and end-to-end tests
        run: pytest

  example-audits:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Build the credit-scoring case study
        run: python examples/credit_scoring/build_model.py
      - name: Run all example audits (gate not enforced here)
        run: |
          pramana run examples/credit_scoring/audit.yaml --out packs/credit_scoring --no-gate
          pramana run examples/support_chatbot/audit.yaml --out packs/support_chatbot --no-gate
          pramana run examples/agent_traces/audit.yaml --out packs/agent_traces --no-gate
      - name: Verify evidence packs
        run: |
          for p in packs/*; do pramana verify "$p"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-audit-packs
          path: packs
