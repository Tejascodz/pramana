name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check src tests dashboard examples
          ruff format --check src tests dashboard examples
      - name: Unit and end-to-end tests
        run: pytest

  example-audits:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Build the credit-scoring case study
        run: python examples/credit_scoring/build_model.py
      - name: Run all example audits (gate not enforced here)
        run: |
          pramana run examples/credit_scoring/audit.yaml --out packs/credit_scoring --no-gate
          pramana run examples/support_chatbot/audit.yaml --out packs/support_chatbot --no-gate
          pramana run examples/agent_traces/audit.yaml --out packs/agent_traces --no-gate
      - name: Verify evidence packs
        run: |
          for p in packs/*; do pramana verify "$p"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-audit-packs
          path: packs

  third-party-validation:
    # COMPAS is a real deployed risk score that Pramana's authors did not build; ProPublica
    # published its error rates by race. The data is downloaded (hash-pinned), never committed.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download and prepare ProPublica's COMPAS data
        run: python examples/compas/prepare.py
      - name: Pramana must reproduce the published findings
        run: pytest tests/test_completeness.py -k compas_audit_reproduces

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install with every optional extra
        run: pip install -e ".[all]" pip-audit bandit
      - name: Known-vulnerable dependencies (pip-audit)
        run: pip-audit --skip-editable
      - name: Static analysis (bandit, medium severity and above)
        run: bandit -q -r src -ll

  package:
    # The wheel a user installs from PyPI, on every OS, run from outside the repository.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the demo
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ -x "$RUNNER_TEMP/smoke/bin/python" ]; then py="$RUNNER_TEMP/smoke/bin/python"; else py="$RUNNER_TEMP/smoke/Scripts/python.exe"; fi
          "$py" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$py" -m pramana demo --out demo
          "$py" -m pramana verify demo/credit-scoring/pack
