# Build, test and publish a release to PyPI when a version tag (v0.6.0) is pushed.
#
# No API token exists anywhere: PyPI Trusted Publishing exchanges a short-lived
# GitHub OIDC token for a one-time upload credential, and only the `pypi`
# environment (which can require a manual approval) may request it. Every file
# gets a Sigstore attestation on PyPI (PEP 740) and a GitHub build-provenance
# attestation, so anyone can check the wheel was built here from this commit.
#
# One-time setup (repository owner):
#   1. pypi.org > Your projects > Publishing > Add a pending publisher:
#      project pramana-audit, owner Tejascodz, repository pramana,
#      workflow release.yml, environment pypi.
#   2. GitHub > Settings > Environments > New environment "pypi"
#      (add yourself as a required reviewer, and limit it to tags v*).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} != version v${version}"; exit 1; }
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the demo
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/pramana demo --out /tmp/demo
          /tmp/smoke/bin/pramana verify /tmp/demo/credit-scoring/pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pramana-audit/
    permissions:
      id-token: write # Trusted Publishing and Sigstore attestations; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the GitHub release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          gh release create "${TAG}" dist/* --repo "${REPO}" --title "${TAG}" \
            --notes "See CHANGELOG.md. Verify: gh attestation verify <file> --repo ${REPO}"
