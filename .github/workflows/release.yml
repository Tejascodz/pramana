# Build, test and release when a version tag (for example v0.7.10) is pushed.
#
# Every tag gets a GitHub release with the wheel, the source archive, SHA256SUMS
# and a build-provenance attestation, so anyone can check a file was built here
# from that commit.
#
# Publishing to PyPI is off until the repository variable PUBLISH_TO_PYPI is set
# to "true" (Settings > Secrets and variables > Actions > Variables). It then uses
# Trusted Publishing, so no API token exists anywhere. One-time setup first:
#   1. pypi.org > Publishing > Add a pending publisher: project pramana-audit,
#      owner Tejascodz, repository pramana, workflow release.yml, environment pypi.
#   2. GitHub > Settings > Environments > New environment "pypi" with yourself as
#      a required reviewer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} != version v${version}"; exit 1; }
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the demo
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/pramana demo --out /tmp/demo
          /tmp/smoke/bin/pramana verify /tmp/demo/credit-scoring/pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pramana-audit/
    permissions:
      id-token: write # Trusted Publishing and Sigstore attestations; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the GitHub release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          gh release create "${TAG}" dist/* --repo "${REPO}" --title "${TAG}" \
            --notes "See CHANGELOG.md. Verify: gh attestation verify <file> --repo ${REPO}"
