name: Pramana AI audit gate
description: Run a Pramana audit on an AI system and fail the job when the release gate blocks.
branding:
  icon: shield
  color: blue

inputs:
  spec:
    description: Path to the Pramana audit spec YAML
    required: true
  out:
    description: Output folder for the audit pack
    required: false
    default: pramana-audit
  python-version:
    description: Python version to use
    required: false
    default: "3.12"
  enforce:
    description: Fail the job when the gate decision is BLOCK
    required: false
    default: "true"

outputs:
  decision:
    description: Release-gate decision (PASS or BLOCK)
    value: ${{ steps.audit.outputs.decision }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Pramana
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install "$ACTION_PATH"
    - name: Run audit
      id: audit
      shell: bash
      # Inputs reach the shell as environment variables, never as script text.
      env:
        SPEC: ${{ inputs.spec }}
        OUT: ${{ inputs.out }}
      run: |
        set +e
        pramana run "$SPEC" --out "$OUT"
        code=$?
        set -e
        if [ "$code" = "1" ]; then echo "decision=BLOCK" >> "$GITHUB_OUTPUT"; elif [ "$code" = "0" ]; then echo "decision=PASS" >> "$GITHUB_OUTPUT"; else exit "$code"; fi
        pramana verify "$OUT"
        pramana summary "$OUT" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload audit pack
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: pramana-audit-pack
        path: ${{ inputs.out }}
    - name: Enforce gate
      if: inputs.enforce == 'true' && steps.audit.outputs.decision == 'BLOCK'
      shell: bash
      run: |
        echo "::error::Pramana release gate blocked this change. See the audit pack artifact."
        exit 1
