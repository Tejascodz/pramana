name: Pramana AI audit gate
description: Run a Pramana audit on an AI system and fail the job when the release gate blocks.
branding:
  icon: shield
  color: blue

inputs:
  spec:
    description: Path to the Pramana audit spec YAML
    required: true
  out:
    description: Output folder for the audit pack
    required: false
    default: pramana-audit
  python-version:
    description: Python version to use
    required: false
    default: "3.12"
  enforce:
    description: Fail the job when the gate decision is BLOCK
    required: false
    default: "true"
  attest:
    description: >
      Sign the pack's ledger with a GitHub build-provenance attestation (Sigstore), so
      anyone can prove which repository, commit and workflow produced it. Needs
      `id-token: write` and `attestations: write` permissions in the calling job.
    required: false
    default: "false"

outputs:
  decision:
    description: Release-gate decision (PASS or BLOCK)
    value: ${{ steps.audit.outputs.decision }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Pramana
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install "$ACTION_PATH"
    - name: Run audit
      id: audit
      shell: bash
      # Inputs reach the shell as environment variables, never as script text.
      env:
        SPEC: ${{ inputs.spec }}
        OUT: ${{ inputs.out }}
      run: |
        set +e
        pramana run "$SPEC" --out "$OUT"
        code=$?
        set -e
        if [ "$code" = "1" ]; then echo "decision=BLOCK" >> "$GITHUB_OUTPUT"; elif [ "$code" = "0" ]; then echo "decision=PASS" >> "$GITHUB_OUTPUT"; else exit "$code"; fi
        pramana verify "$OUT"
        pramana summary "$OUT" >> "$GITHUB_STEP_SUMMARY"
    - name: Attest the audit pack
      if: inputs.attest == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        # The ledger seals every file in the pack (pramana verify checks them against it),
        # so attesting the ledger, results and report covers the whole pack.
        subject-path: |
          ${{ inputs.out }}/ledger.jsonl
          ${{ inputs.out }}/results.json
          ${{ inputs.out }}/report.html
    - name: Upload audit pack
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: pramana-audit-pack
        path: ${{ inputs.out }}
    - name: Enforce gate
      if: inputs.enforce == 'true' && steps.audit.outputs.decision == 'BLOCK'
      shell: bash
      run: |
        echo "::error::Pramana release gate blocked this change. See the audit pack artifact."
        exit 1
