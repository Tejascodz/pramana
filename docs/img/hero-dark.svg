<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Pramana</title>
<desc>Pramana: the audit engine for AI systems. Tabular models, LLM applications and AI agents go through 30 checks into a hash-chained, signed evidence pack, which decides the release gate (block or pass). Mapped to NIST AI RMF, ISO/IEC 42001, the EU AI Act and the OWASP LLM Top 10: 184 controls in 8 frameworks.</desc>
<rect width="1280" height="400" rx="12" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="1279" height="399" rx="12" fill="#0d1117" stroke="#3d444d"/>
<text x="56.0" y="112.0" font-size="64" fill="#e6edf3" text-anchor="start" font-weight="750" letter-spacing="-1.5">Pramana</text>
<text x="58.0" y="150.0" font-size="22" fill="#9198a1" text-anchor="start" font-weight="500">The audit engine for AI systems</text>
<text x="58.0" y="196.0" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="400">Tests ML models, LLM applications and agents against</text>
<text x="58.0" y="220.0" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="400">the real system, seals the evidence in a signed,</text>
<text x="58.0" y="244.0" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="400">hash-chained pack and gates the release.</text>
<rect x="58" y="300" width="106" height="30" rx="15" fill="#151b23" stroke="#3d444d"/>
<text x="110.8" y="320.0" font-size="13" fill="#9198a1" text-anchor="middle" font-weight="500">NIST AI RMF</text>
<rect x="173.6" y="300" width="121" height="30" rx="15" fill="#151b23" stroke="#3d444d"/>
<text x="234.0" y="320.0" font-size="13" fill="#9198a1" text-anchor="middle" font-weight="500">ISO/IEC 42001</text>
<rect x="304.4" y="300" width="90" height="30" rx="15" fill="#151b23" stroke="#3d444d"/>
<text x="349.6" y="320.0" font-size="13" fill="#9198a1" text-anchor="middle" font-weight="500">EU AI Act</text>
<rect x="404.79999999999995" y="300" width="144" height="30" rx="15" fill="#151b23" stroke="#3d444d"/>
<text x="476.6" y="320.0" font-size="13" fill="#9198a1" text-anchor="middle" font-weight="500">OWASP LLM Top 10</text>
<text x="58.0" y="360.0" font-size="13" fill="#9198a1" text-anchor="start" font-weight="400">184 controls in 8 frameworks</text>
<rect x="640" y="70" width="150" height="64" rx="10" fill="#151b23" stroke="#3d444d"/>
<rect x="640" y="70" width="5" height="64" rx="2.5" fill="#338ced"/>
<text x="660.0" y="108.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Tabular model</text>
<path d="M790,102 C825,102 825,194 852,194" fill="none" stroke="#3d444d" stroke-width="2"/>
<rect x="640" y="162" width="150" height="64" rx="10" fill="#151b23" stroke="#3d444d"/>
<rect x="640" y="162" width="5" height="64" rx="2.5" fill="#e76624"/>
<text x="660.0" y="200.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">LLM application</text>
<path d="M790,194 C825,194 825,194 852,194" fill="none" stroke="#3d444d" stroke-width="2"/>
<rect x="640" y="254" width="150" height="64" rx="10" fill="#151b23" stroke="#3d444d"/>
<rect x="640" y="254" width="5" height="64" rx="2.5" fill="#00a888"/>
<text x="660.0" y="292.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">AI agent</text>
<path d="M790,286 C825,286 825,194 852,194" fill="none" stroke="#3d444d" stroke-width="2"/>
<rect x="854" y="132" width="150" height="124" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="929.0" y="180.0" font-size="34" fill="#e6edf3" text-anchor="middle" font-weight="750">30</text>
<text x="929.0" y="204.0" font-size="14" fill="#9198a1" text-anchor="middle" font-weight="400">checks</text>
<text x="929.0" y="230.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">live, adaptive, replayable</text>
<line x1="1004" y1="194" x2="1040" y2="194" stroke="#3d444d" stroke-width="2"/>
<path d="M1040,188 L1048,194 L1040,200 Z" fill="#3d444d"/>
<rect x="1052" y="132" width="150" height="124" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="1127.0" y="170.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">Evidence pack</text>
<text x="1127.0" y="194.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">hash-chained ledger</text>
<text x="1127.0" y="212.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">Ed25519 signature</text>
<text x="1127.0" y="230.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="400">Sigstore attestation</text>
<line x1="1127" y1="256" x2="1127" y2="292" stroke="#3d444d" stroke-width="2"/>
<text x="1127.0" y="314.0" font-size="12" fill="#9198a1" text-anchor="middle" font-weight="400">Release gate</text>
<rect x="1044" y="324" width="78" height="30" rx="15" fill="#eb6263"/>
<text x="1083.0" y="344.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">✕ BLOCK</text>
<rect x="1132" y="324" width="78" height="30" rx="15" fill="#0aac23"/>
<text x="1171.0" y="344.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">✓ PASS</text>
</svg>
