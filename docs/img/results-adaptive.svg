<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="488" viewBox="0 0 1000 488" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Fixed versus adaptive attacks against a third-party guard</title>
<desc>Attacker-chosen code: fixed attacks 39/52 without the guard, 7/52 behind it; adaptive search reached it at query 17; Rule-free persona: fixed attacks 26/32 without the guard, 0/32 behind it; adaptive search reached it at query 14; System-prompt secret: fixed attacks 14/28 without the guard, 0/28 behind it; adaptive search did not reach it; Exfiltration link: fixed attacks 30/34 without the guard, 10/34 behind it; adaptive search reached it at query 4</desc>
