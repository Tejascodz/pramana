<text x="28.0" y="38.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="650">A third-party guard stops most fixed attacks. An adaptive search still gets through.</text>
<text x="28.0" y="62.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="400">Qwen2.5-14B with a confidential system prompt, without and behind ProtectAI&#x27;s open prompt-injection classifier.</text>
<text x="28.0" y="80.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="400">Fixed attacks: 109 of 146 succeeded without the guard, 17 of 146 behind it.</text>
