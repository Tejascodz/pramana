<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>COMPAS error rates by race</title>
<desc>Black defendants who did not reoffend: labelled higher risk: Pramana 42.3%, ProPublica 44.9%; White defendants who did not reoffend: labelled higher risk: Pramana 22.0%, ProPublica 23.5%; Black defendants who reoffended: labelled lower risk: Pramana 28.5%, ProPublica 28.0%; White defendants who reoffended: labelled lower risk: Pramana 49.6%, ProPublica 47.7%</desc>
<rect width="1000" height="392" rx="12" fill="#ffffff"/>
<text x="28.0" y="38.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="650">COMPAS error rates by race: Pramana against ProPublica&#x27;s published analysis</text>
<text x="28.0" y="62.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="400">Real risk scores for 6,172 defendants in Broward County, Florida; a decile of 5 to 10 counts as higher risk.</text>
<rect x="330" y="82" width="12" height="12" rx="3" fill="#257de0"/>
<text x="348.0" y="92.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">Measured by Pramana</text>
<rect x="493" y="82" width="12" height="12" rx="3" fill="#00b894"/>
<text x="511.0" y="92.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">Published by ProPublica (2016)</text>
<line x1="330.0" y1="104" x2="330.0" y2="322" stroke="#e7e7e7"/>
<text x="330.0" y="340.0" font-size="11.5" fill="#59636e" text-anchor="middle" font-weight="400">0%</text>
<line x1="490.0" y1="104" x2="490.0" y2="322" stroke="#e7e7e7"/>
<text x="490.0" y="340.0" font-size="11.5" fill="#59636e" text-anchor="middle" font-weight="400">20%</text>
<line x1="650.0" y1="104" x2="650.0" y2="322" stroke="#e7e7e7"/>
<text x="650.0" y="340.0" font-size="11.5" fill="#59636e" text-anchor="middle" font-weight="400">40%</text>
<line x1="810.0" y1="104" x2="810.0" y2="322" stroke="#e7e7e7"/>
<text x="810.0" y="340.0" font-size="11.5" fill="#59636e" text-anchor="middle" font-weight="400">60%</text>
<line x1="330" y1="104" x2="330" y2="322" stroke="#c2c2c2"/>
<text x="28.0" y="126.0" font-size="13.5" fill="#1f2328" text-anchor="start" font-weight="600">Black defendants who did not reoffend:</text>
<text x="28.0" y="143.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="400">labelled higher risk</text>
<path d="M330.0,114.0 H664.7 Q668.7,114.0 668.7,118.0 V127.0 Q668.7,131.0 664.7,131.0 H330.0 Z" fill="#257de0"/>
<text x="676.7" y="127.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">42.3%</text>
<path d="M330.0,133.0 H685.2 Q689.2,133.0 689.2,137.0 V146.0 Q689.2,150.0 685.2,150.0 H330.0 Z" fill="#00b894"/>
<text x="697.2" y="146.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">44.9%</text>
<text x="28.0" y="182.0" font-size="13.5" fill="#1f2328" text-anchor="start" font-weight="600">White defendants who did not reoffend:</text>
<text x="28.0" y="199.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="400">labelled higher risk</text>
<path d="M330.0,170.0 H502.1 Q506.1,170.0 506.1,174.0 V183.0 Q506.1,187.0 502.1,187.0 H330.0 Z" fill="#257de0"/>
<text x="514.1" y="183.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">22.0%</text>
<path d="M330.0,189.0 H514.0 Q518.0,189.0 518.0,193.0 V202.0 Q518.0,206.0 514.0,206.0 H330.0 Z" fill="#00b894"/>
<text x="526.0" y="202.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">23.5%</text>
<text x="28.0" y="238.0" font-size="13.5" fill="#1f2328" text-anchor="start" font-weight="600">Black defendants who reoffended:</text>
<text x="28.0" y="255.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="400">labelled lower risk</text>
<path d="M330.0,226.0 H553.8 Q557.8,226.0 557.8,230.0 V239.0 Q557.8,243.0 553.8,243.0 H330.0 Z" fill="#257de0"/>
<text x="565.8" y="239.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">28.5%</text>
<path d="M330.0,245.0 H550.0 Q554.0,245.0 554.0,249.0 V258.0 Q554.0,262.0 550.0,262.0 H330.0 Z" fill="#00b894"/>
<text x="562.0" y="258.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">28.0%</text>
<text x="28.0" y="294.0" font-size="13.5" fill="#1f2328" text-anchor="start" font-weight="600">White defendants who reoffended:</text>
<text x="28.0" y="311.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="400">labelled lower risk</text>
<path d="M330.0,282.0 H723.1 Q727.1,282.0 727.1,286.0 V295.0 Q727.1,299.0 723.1,299.0 H330.0 Z" fill="#257de0"/>
<text x="735.1" y="295.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="600">49.6%</text>
<path d="M330.0,301.0 H707.6 Q711.6,301.0 711.6,305.0 V314.0 Q711.6,318.0 707.6,318.0 H330.0 Z" fill="#00b894"/>
<text x="719.6" y="314.0" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">47.7%</text>
<text x="28.0" y="374.0" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">Source: docs/sample-audits/compas and ProPublica, &#x27;How We Analyzed the COMPAS Recidivism Algorithm&#x27; (2016).</text>
</svg>
