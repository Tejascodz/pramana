<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>COMPAS error rates by race</title>
<desc>Black defendants who did not reoffend: labelled higher risk: Pramana 42.3%, ProPublica 44.9%; White defendants who did not reoffend: labelled higher risk: Pramana 22.0%, ProPublica 23.5%; Black defendants who reoffended: labelled lower risk: Pramana 28.5%, ProPublica 28.0%; White defendants who reoffended: labelled lower risk: Pramana 49.6%, ProPublica 47.7%</desc>
<rect width="900" height="344" fill="#ffffff"/>
<text x="24.0" y="30.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="650">COMPAS error rates by race: Pramana against ProPublica&#x27;s published analysis</text>
<text x="24.0" y="50.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Real risk scores for 6,172 defendants in Broward County, Florida. A decile of 5 to 10 counts as higher risk.</text>
<rect x="310" y="62" width="12" height="12" rx="2" fill="#2f6fdb"/>
<text x="328.0" y="72.5" font-size="12" fill="#1f2937" text-anchor="start" font-weight="400">Measured by Pramana</text>
<rect x="470" y="62" width="12" height="12" rx="2" fill="#9aa4b2"/>
<text x="488.0" y="72.5" font-size="12" fill="#1f2937" text-anchor="start" font-weight="400">Published by ProPublica (2016)</text>
<line x1="310.0" y1="86" x2="310.0" y2="280" stroke="#e5e7eb" stroke-width="1"/>
<text x="310.0" y="298.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">0%</text>
<line x1="466.7" y1="86" x2="466.7" y2="280" stroke="#e5e7eb" stroke-width="1"/>
<text x="466.7" y="298.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">20%</text>
<line x1="623.3" y1="86" x2="623.3" y2="280" stroke="#e5e7eb" stroke-width="1"/>
<text x="623.3" y="298.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">40%</text>
<line x1="780.0" y1="86" x2="780.0" y2="280" stroke="#e5e7eb" stroke-width="1"/>
<text x="780.0" y="298.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">60%</text>
<text x="24.0" y="104.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">Black defendants who did not reoffend:</text>
<text x="24.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">labelled higher risk</text>
<rect x="310" y="94" width="331.6" height="14" rx="3" fill="#2f6fdb"/>
<text x="649.6" y="105.5" font-size="12" fill="#1f2937" text-anchor="start" font-weight="400">42.3%</text>
<rect x="310" y="111" width="351.7" height="14" rx="3" fill="#9aa4b2"/>
<text x="669.7" y="122.5" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">44.9%</text>
<text x="24.0" y="154.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">White defendants who did not reoffend:</text>
<text x="24.0" y="170.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">labelled higher risk</text>
<rect x="310" y="144" width="172.4" height="14" rx="3" fill="#2f6fdb"/>
<text x="490.4" y="155.5" font-size="12" fill="#1f2937" text-anchor="start" font-weight="400">22.0%</text>
<rect x="310" y="161" width="184.1" height="14" rx="3" fill="#9aa4b2"/>
<text x="502.1" y="172.5" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">23.5%</text>
<text x="24.0" y="204.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">Black defendants who reoffended:</text>
<text x="24.0" y="220.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">labelled lower risk</text>
<rect x="310" y="194" width="223.1" height="14" rx="3" fill="#2f6fdb"/>
<text x="541.1" y="205.5" font-size="12" fill="#1f2937" text-anchor="start" font-weight="400">28.5%</text>
<rect x="310" y="211" width="219.3" height="14" rx="3" fill="#9aa4b2"/>
<text x="537.3" y="222.5" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">28.0%</text>
<text x="24.0" y="254.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="400">White defendants who reoffended:</text>
<text x="24.0" y="270.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">labelled lower risk</text>
<rect x="310" y="244" width="388.8" height="14" rx="3" fill="#2f6fdb"/>
<text x="706.8" y="255.5" font-size="12" fill="#1f2937" text-anchor="start" font-weight="400">49.6%</text>
<rect x="310" y="261" width="373.7" height="14" rx="3" fill="#9aa4b2"/>
<text x="691.7" y="272.5" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">47.7%</text>
<text x="24.0" y="330.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">Source: docs/sample-audits/compas and ProPublica, &#x27;How We Analyzed the COMPAS Recidivism Algorithm&#x27;.</text>
</svg>
