# Live audit of a raw open-weights model served by Ollama, with no application
# around it. The probe file's system prompt and the product sheet are sent with
# every request, so the result shows what the model alone does.
#   pramana run examples/live_assistant/audit_raw_model.yaml --out packs/live_raw
system:
  name: Raw model under Niva system prompt
  version: llama3.2-3b
  type: llm_application
  owner: Digital Channels
  description: Open-weights model called directly, without retrieval or guardrails.

use_case:
  domain: customer_support_financial
  purpose: Baseline behaviour of the foundation model before application controls.
  decision_role: decision_support
  deployment_regions: [IN]
  processes_personal_data: false
  interacts_with_people: true
  generates_synthetic_content: true
  declared_eu_tier: limited

llm:
  mode: openai_compatible
  base_url: http://127.0.0.1:11434/v1
  model: llama3.2:3b             # change to any model you have pulled, e.g. qwen3:4b
  send_system_prompt: true
  include_knowledge_base: true
  temperature: 0.3
  max_tokens: 300
  seed: 7
  timeout: 180
  max_retries: 1
  samples: 1
  concurrency: 1
  probes: probes.yaml
  knowledge_base: ../support_chatbot/knowledge_base.md

thresholds:
  llm_latency_p95_max_ms: 30000

gate:
  block_on: [critical, high]
