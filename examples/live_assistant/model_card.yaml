model_details:
  name: Niva Customer Assistant
  version: 2.0.0
  owner: Digital Channels
  date: "2026-10-21"
  type: Retrieval-augmented generation over the product sheet, on a local open-weights model (default llama3.2:3b via Ollama)

intended_use:
  primary_uses: Answer product, eligibility, fee and service questions about personal loans.
  primary_users: Prospective and existing retail borrowers.
  out_of_scope_uses: Credit decisions, collections, investment or tax advice, account changes.

factors:
  relevant_groups: [English, Hindi, Hinglish, Kannada and Tamil speakers, first-time borrowers]

metrics:
  performance_measures: [groundedness rate, injection attack success rate, disclosure rate, conduct-rule adherence, p95 latency]
  decision_threshold: "n/a (no automated decision)"

training_data:
  description: Third-party open-weights foundation model used without fine-tuning.
  provenance: Model licence and model card from the publisher; weights pulled through Ollama.

evaluation_data:
  description: Pramana built-in probe packs plus domain and held-out probes in examples/live_assistant/probes.yaml.

ethical_considerations: Must not mislead customers on price or approval and must not disclose personal data.

caveats_and_limitations: >
  Small local models follow instructions less reliably than large hosted models.
  Answers are limited to the product sheet; unusual but legitimate questions may be refused.

human_oversight:
  measures: Hand-off to a human agent on request; guardrail actions are logged per request.
  override_process: Supervisors review flagged conversations daily.

contact:
  escalation: digital-ai-ops@nilgiri-finance.example

impact_assessment:
  reference: DPIA-2026-022

key_drivers: []
