[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pramana"
version = "0.2.2"
description = "Pramana, the AI Assurance & Evidence Engine: run technical tests, map results to NIST AI RMF, ISO/IEC 42001, the EU AI Act and India's AI Governance Guidelines, and produce a tamper-evident audit pack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tejas" }]
keywords = [
  "ai-governance", "ai-audit", "responsible-ai", "nist-ai-rmf", "iso-42001",
  "eu-ai-act", "fairness", "model-risk-management", "llm-evaluation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "joblib>=1.3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.46"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
pramana = "pramana.cli:main"

[project.urls]
Homepage = "https://github.com/Tejascodz/pramana"
Documentation = "https://github.com/Tejascodz/pramana/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pramana = ["controls/data/*.yaml", "reporting/templates/*.j2", "probes/packs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
