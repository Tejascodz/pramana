# Crosswalk from Pramana checks to framework controls.
# Each check also carries the failure mode it is designed to detect; the audit
# engine uses these to build the FMEA table in the Mapping stage (SMACTR).
# References use the form "<FRAMEWORK>:<CONTROL-ID>".

checks:
  governance.risk_classification:
    failure_mode: "System deployed without a documented risk classification"
    effect: "Wrong obligations applied; high-risk duties missed"
    controls: [NIST:MAP-1.1, NIST:MAP-3.3, NIST:MAP-1.5, NIST:GOVERN-1.1, ISO42001:A.9.4, ISO42001:A.5.2, EUAIA:Art-5, EUAIA:Art-6, INDIA:PILLAR-RISK-MITIGATION]

  performance.discrimination:
    failure_mode: "Model does not separate good and bad outcomes well enough for its intended use"
    effect: "Wrong decisions at scale; financial and customer harm"
    controls: [NIST:MEASURE-2.3, NIST:MEASURE-2.5, NIST:MEASURE-2.1, NIST:MANAGE-1.1, ISO42001:A.6.2.4, EUAIA:Art-15, INDIA:SUTRA-SAFETY]

  fairness.group_parity:
    failure_mode: "Outcomes or error rates differ materially across protected groups"
    effect: "Discrimination against applicants; legal and reputational exposure"
    controls: [NIST:MEASURE-2.11, NIST:MAP-5.1, ISO42001:A.5.4, ISO42001:A.7.4, EUAIA:Art-10, INDIA:SUTRA-FAIRNESS, NIST-GAI:HARMFUL-BIAS]

  fairness.intersectional:
    failure_mode: "Disparity hidden inside combinations of attributes (e.g. rural women)"
    effect: "Sub-group harm that single-attribute tests miss"
    controls: [NIST:MEASURE-2.11, ISO42001:A.5.4, EUAIA:Art-10, INDIA:SUTRA-FAIRNESS]

  fairness.proxy_features:
    failure_mode: "Model inputs act as proxies for protected attributes"
    effect: "Indirect discrimination even when protected attributes are excluded"
    controls: [NIST:MEASURE-2.11, NIST:MAP-2.3, ISO42001:A.7.4, ISO42001:A.7.6, EUAIA:Art-10, INDIA:SUTRA-FAIRNESS]

  robustness.perturbation:
    failure_mode: "Small input noise or missing values flip decisions"
    effect: "Unstable, unrepeatable outcomes; exploitable behaviour"
    controls: [NIST:MEASURE-2.5, NIST:MEASURE-2.7, NIST:MEASURE-2.6, ISO42001:A.6.2.4, EUAIA:Art-15, INDIA:SUTRA-SAFETY]

  calibration.reliability:
    failure_mode: "Predicted probabilities do not match observed rates"
    effect: "Mispriced risk; misleading scores shown to reviewers"
    controls: [NIST:MEASURE-2.5, NIST:MEASURE-2.9, ISO42001:A.6.2.4, EUAIA:Art-15, INDIA:SUTRA-UNDERSTANDABLE]

  drift.population_stability:
    failure_mode: "Production data no longer resembles the data the model was validated on"
    effect: "Silent performance and fairness decay after deployment"
    controls: [NIST:MEASURE-2.4, NIST:MEASURE-4.3, NIST:MANAGE-4.1, NIST:MANAGE-2.2, ISO42001:A.6.2.6, EUAIA:Art-72, INDIA:SUTRA-SAFETY]

  explainability.feature_importance:
    failure_mode: "Decision drivers are unknown, undocumented or include prohibited inputs"
    effect: "Decisions cannot be explained to customers, reviewers or regulators"
    controls: [NIST:MEASURE-2.9, NIST:MAP-2.2, ISO42001:A.6.2.7, ISO42001:A.8.2, EUAIA:Art-13, INDIA:SUTRA-UNDERSTANDABLE]

  privacy.pii_exposure:
    failure_mode: "Direct identifiers present in modelling or evaluation datasets"
    effect: "Unnecessary personal-data processing; breach impact"
    controls: [NIST:MEASURE-2.10, ISO42001:A.7.2, ISO42001:A.7.5, EUAIA:Art-10, INDIA:DPDP-2023, NIST-GAI:DATA-PRIVACY]

  privacy.membership_inference:
    failure_mode: "Model memorizes training records so membership can be inferred"
    effect: "Re-identification of individuals in the training set"
    controls: [NIST:MEASURE-2.10, NIST:MEASURE-2.7, ISO42001:A.6.2.4, EUAIA:Art-15, INDIA:DPDP-2023]

  data_quality.integrity:
    failure_mode: "Missing values, duplicates, imbalance or target leakage in data"
    effect: "Biased or over-optimistic validation results"
    controls: [NIST:MAP-2.3, NIST:MEASURE-2.1, ISO42001:A.7.4, ISO42001:A.7.6, ISO42001:A.4.3, EUAIA:Art-10]

  documentation.model_card:
    failure_mode: "Intended use, limitations and oversight measures are not documented"
    effect: "Misuse outside scope; failed technical-documentation review"
    controls: [NIST:MAP-2.2, NIST:MAP-3.5, NIST:GOVERN-4.2, NIST:MEASURE-2.8, ISO42001:A.6.2.3, ISO42001:A.6.2.7, ISO42001:A.8.2, EUAIA:Art-11, EUAIA:Art-13, EUAIA:Art-14, INDIA:SUTRA-UNDERSTANDABLE, INDIA:SUTRA-ACCOUNTABILITY]

  audit.detector_sensitivity:
    failure_mode: "Audit tests fail to detect a defect that is known to exist"
    effect: "False assurance from the audit itself"
    controls: [NIST:MEASURE-2.13, NIST:MEASURE-1.2, ISO42001:A.6.2.4]

  llm.prompt_injection:
    failure_mode: "Instructions embedded in user or retrieved content override system rules"
    effect: "Policy bypass, data exfiltration, unauthorized actions"
    controls: [NIST:MEASURE-2.7, NIST-GAI:INFO-SECURITY, OWASP-LLM:LLM01, OWASP-LLM:LLM07, ISO42001:A.6.2.4, EUAIA:Art-15, INDIA:SUTRA-SAFETY]

  llm.sensitive_disclosure:
    failure_mode: "Assistant reveals personal data or confidential configuration"
    effect: "Privacy breach and regulatory exposure"
    controls: [NIST:MEASURE-2.10, NIST-GAI:DATA-PRIVACY, OWASP-LLM:LLM02, ISO42001:A.7.2, EUAIA:Art-15, INDIA:DPDP-2023]

  llm.groundedness:
    failure_mode: "Answers contain facts or figures not supported by the knowledge base"
    effect: "Customers act on wrong information; mis-selling"
    controls: [NIST:MEASURE-2.5, NIST:MEASURE-2.9, NIST-GAI:CONFABULATION, NIST-GAI:INFO-INTEGRITY, OWASP-LLM:LLM09, EUAIA:Art-15, INDIA:SUTRA-TRUST]

  llm.policy_adherence:
    failure_mode: "Assistant gives prohibited advice or omits required disclosures"
    effect: "Consumer harm; breach of conduct rules"
    controls: [NIST:MEASURE-2.6, NIST-GAI:HUMAN-AI-CONFIG, NIST-GAI:DANGEROUS-CONTENT, OWASP-LLM:LLM05, EUAIA:Art-50, INDIA:SUTRA-PEOPLE-FIRST]

  llm.service_health:
    failure_mode: "Endpoint errors, slow responses or unbounded output under test load"
    effect: "Unavailable or costly service; degraded answers during peak demand"
    controls: [NIST:MEASURE-2.4, NIST:MANAGE-4.1, OWASP-LLM:LLM10, ISO42001:A.6.2.6, EUAIA:Art-15, INDIA:SUTRA-SAFETY]

  agent.trace_auditability:
    failure_mode: "Agent actions cannot be attributed, reconstructed or shown to be approved"
    effect: "Accountability gap: actions occur with no traceable authority"
    controls: [NIST:MEASURE-2.8, NIST:GOVERN-3.2, NIST:MANAGE-4.3, NIST:MAP-3.5, ISO42001:A.6.2.8, OWASP-LLM:LLM06, EUAIA:Art-12, EUAIA:Art-14, INDIA:SUTRA-ACCOUNTABILITY, INDIA:PILLAR-ACCOUNTABILITY]

  agent.misalignment_signals:
    failure_mode: "Agent reasoning or actions show it pursuing goals against its instructions (self-preservation, deception, oversight evasion, privilege escalation, reward hacking)"
    effect: "Autonomous system takes harmful instrumental actions; loss of human control"
    controls: [NIST:MEASURE-2.6, NIST:MEASURE-2.7, NIST:MANAGE-4.1, NIST:MANAGE-4.3, ISO42001:A.6.2.6, OWASP-LLM:LLM06, EUAIA:Art-14, EUAIA:Art-15, INDIA:SUTRA-SAFETY, INDIA:SUTRA-ACCOUNTABILITY]

  audit.process:
    failure_mode: "No documented test plan, go/no-go decision or risk treatment for the release"
    effect: "Deployment decisions cannot be shown to be risk-based"
    controls: [NIST:MEASURE-1.1, NIST:MEASURE-2.1, NIST:MAP-5.1, NIST:MANAGE-1.1, NIST:MANAGE-1.2, NIST:MANAGE-1.3, NIST:MANAGE-1.4, ISO42001:A.5.3, EUAIA:Art-9, INDIA:PILLAR-RISK-MITIGATION]
